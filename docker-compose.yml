name: border-ai

x-hardened: &hardened
  restart: unless-stopped
  init: true
  user: "10001:10001"
  read_only: true
  tmpfs: ["/tmp:size=128m,mode=1777"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  environment: &env
    TZ: UTC
    NODE_ENV: production

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    init: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "FOWNER", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    environment:
      TZ: UTC
      POSTGRES_DB: border_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin_password
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    secrets:
      - pg_admin_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d border_ai"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    stop_grace_period: 30s
    shm_size: 256m
    mem_limit: 2g

  redis:
    image: redis:7.4-bookworm
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    command: ["redis-server", "/etc/redis/redis.conf", "--aclfile", "/run/secrets/redis_acl"]
    secrets:
      - redis_acl
      - redis_healthcheck_password
    volumes:
      - redisdata:/data
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user healthcheck --pass \"$$(cat /run/secrets/redis_healthcheck_password)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g

  mediamtx:
    image: bluenviron/mediamtx:1.9.3-ffmpeg
    <<: *hardened
    user: "0:0"
    volumes:
      - ./docker/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    secrets:
      - mediamtx_publish_password
      - mediamtx_read_password
    networks:
      - media
    profiles:
      - demo
      - test

  db-init:
    image: border-ai/backend:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    <<: *hardened
    restart: "no"
    command: ["node", "dist/scripts/db-init.js"]
    secrets:
      - pg_admin_password
      - pg_api_password
      - pg_engine_password
      - pg_sink_password
      - pg_retention_password
    environment:
      <<: *env
      DB_HOST: postgres
      DB_NAME: border_ai
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data

  migrate:
    image: border-ai/backend:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    <<: *hardened
    restart: "no"
    command: ["node", "dist/scripts/migrate.js"]
    secrets:
      - pg_admin_password
    environment:
      <<: *env
      DB_HOST: postgres
      DB_NAME: border_ai
      DATABASE_URL_FILE: /run/secrets/pg_admin_password
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - data

  model-init:
    image: border-ai/ai-engine:${IMAGE_TAG:-dev}-${TORCH_VARIANT:-cpu}
    build:
      context: .
      dockerfile: docker/ai-engine/Dockerfile
      args:
        TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
    <<: *hardened
    restart: "no"
    command: ["python", "-m", "engine.tools.fetch_models", "--manifest", "/configs/models.lock.json", "--dest", "/models"]
    environment:
      <<: *env
      OFFLINE: "${OFFLINE:-0}"
    volumes:
      - models:/models
      - ./configs:/configs:ro
    networks:
      - egress

  bootstrap-admin:
    image: border-ai/backend:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    <<: *hardened
    restart: "no"
    command: ["node", "dist/scripts/create-admin.js", "--non-interactive", "--if-none-exists"]
    secrets:
      - pg_api_password
      - bootstrap_admin_password
      - password_pepper
    environment:
      <<: *env
      DB_HOST: postgres
      DB_USER: border_api
      BOOTSTRAP_ADMIN_USER: admin
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data

  backend:
    image: border-ai/backend:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    <<: *hardened
    environment:
      <<: *env
      PORT: "4000"
      DB_HOST: postgres
      DB_USER: border_api
      DB_NAME: border_ai
      REDIS_HOST: redis
      REDIS_USER: api
      CORS_ORIGINS: "https://${PUBLIC_HOST:-localhost}:${HTTPS_PORT:-443}"
      COOKIE_SECURE: "true"
      TRUST_PROXY: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
      SNAPSHOT_DIR: /data/snapshots
      STREAM_PUBLIC_BASE: /stream
      ENGINE_INTERNAL_URL: http://ai-engine:8001
      NOTIFICATIONS_ENABLED: "${NOTIFICATIONS_ENABLED:-true}"
      NOTIFICATIONS_DRY_RUN: "${NOTIFICATIONS_DRY_RUN:-true}"
      NOTIFY_ALLOWED_DOMAINS: "${NOTIFY_ALLOWED_DOMAINS:-example.org,border-ai.local}"
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      MASTER_KEY_FILE: /run/secrets/master_key
      PASSWORD_PEPPER_FILE: /run/secrets/password_pepper
      DB_PASSWORD_FILE: /run/secrets/pg_api_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_api_password
      SMTP_HOST: "${SMTP_HOST:-mailpit}"
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    secrets:
      - jwt_private_key
      - master_key
      - password_pepper
      - pg_api_password
      - redis_api_password
      - smtp_password
      - internal_token
    volumes:
      - snapshots:/data/snapshots:ro
      - ./configs:/configs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - app
      - data
      - egress
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 2

  ai-engine:
    image: border-ai/ai-engine:${IMAGE_TAG:-dev}-${TORCH_VARIANT:-cpu}
    build:
      context: .
      dockerfile: docker/ai-engine/Dockerfile
      args:
        TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
    <<: *hardened
    command: ["python", "-m", "engine.main"]
    environment:
      <<: *env
      ENGINE_CONFIG: /configs/engine.json
      DB_HOST: postgres
      DB_NAME: border_ai
      DB_USER: border_engine
      REDIS_HOST: redis
      REDIS_USER: engine
      SNAPSHOT_DIR: /data/snapshots
      JOURNAL_DIR: /data/journal
      MODELS_DIR: /models
      PADDLE_HOME: /tmp/paddle
      TORCH_HOME: /tmp/torch
      YOLO_CONFIG_DIR: /tmp/ultralytics
      RTSP_TRANSPORT: tcp
      DB_PASSWORD_FILE: /run/secrets/pg_engine_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_engine_password
      MASTER_KEY_FILE: /run/secrets/master_key
      INTERNAL_TOKEN_FILE: /run/secrets/internal_token
      JWKS_URL: http://backend:4000/.well-known/jwks.json
    secrets:
      - pg_engine_password
      - redis_engine_password
      - master_key
      - internal_token
      - mediamtx_read_password
    volumes:
      - snapshots:/data/snapshots
      - journal:/data/journal
      - models:/models:ro
      - ./configs:/configs:ro
    shm_size: 1g
    depends_on:
      model-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - app
      - data
      - media
    stop_grace_period: 45s
    mem_limit: 6g
    cpus: 4

  sink:
    image: border-ai/ai-engine:${IMAGE_TAG:-dev}-${TORCH_VARIANT:-cpu}
    build:
      context: .
      dockerfile: docker/ai-engine/Dockerfile
      args:
        TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
    <<: *hardened
    command: ["python", "-m", "engine.sinks.postgres_consumer"]
    environment:
      <<: *env
      DB_HOST: postgres
      DB_NAME: border_ai
      DB_USER: border_sink
      REDIS_HOST: redis
      REDIS_USER: sink
      DB_PASSWORD_FILE: /run/secrets/pg_sink_password
      REDIS_PASSWORD_FILE: /run/secrets/redis_sink_password
    secrets:
      - pg_sink_password
      - redis_sink_password
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - data
    mem_limit: 512m

  retention:
    image: border-ai/backend:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    <<: *hardened
    command: ["node", "dist/scripts/retention-loop.js"]
    environment:
      <<: *env
      DB_HOST: postgres
      DB_NAME: border_ai
      DB_USER: border_retention
      DB_PASSWORD_FILE: /run/secrets/pg_retention_password
      RETENTION_EVENTS_DAYS: "${RETENTION_EVENTS_DAYS:-30}"
      RETENTION_SNAPSHOTS_DAYS: "${RETENTION_SNAPSHOTS_DAYS:-14}"
      RETENTION_AUDIT_DAYS: "${RETENTION_AUDIT_DAYS:-365}"
      SNAPSHOT_DIR: /data/snapshots
    secrets:
      - pg_retention_password
    volumes:
      - snapshots:/data/snapshots
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data

  frontend:
    image: border-ai/frontend:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks:
      - app

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${HTTPS_PORT:-443}:8443"
      - "${HTTP_PORT:-80}:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    networks:
      - edge
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1:8443/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    networks:
      - app
    profiles:
      - demo
      - dev

  cctv-sim:
    image: border-ai/sim:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/sim/Dockerfile
    restart: unless-stopped
    command: ["python", "supervisor.py", "--scenario", "${SCENARIO:-demo}"]
    volumes:
      - ./footage:/footage:ro
      - ./scenarios:/scenarios:ro
    secrets:
      - mediamtx_publish_password
    depends_on:
      - mediamtx
    networks:
      - media
    profiles:
      - demo
      - test

networks:
  edge: {}
  app:
    internal: true
  data:
    internal: true
  media:
    internal: true
  egress: {}

volumes:
  pgdata: {}
  redisdata: {}
  snapshots: {}
  journal: {}
  models: {}

secrets:
  pg_admin_password:
    file: ./secrets/pg_admin_password
  pg_api_password:
    file: ./secrets/pg_api_password
  pg_engine_password:
    file: ./secrets/pg_engine_password
  pg_sink_password:
    file: ./secrets/pg_sink_password
  pg_retention_password:
    file: ./secrets/pg_retention_password
  redis_acl:
    file: ./secrets/users.acl
  redis_healthcheck_password:
    file: ./secrets/redis_healthcheck_password
  redis_engine_password:
    file: ./secrets/redis_engine_password
  redis_sink_password:
    file: ./secrets/redis_sink_password
  redis_api_password:
    file: ./secrets/redis_api_password
  jwt_private_key:
    file: ./secrets/jwt_private_key
  master_key:
    file: ./secrets/master_key
  password_pepper:
    file: ./secrets/password_pepper
  smtp_password:
    file: ./secrets/smtp_password
  internal_token:
    file: ./secrets/internal_token
  mediamtx_publish_password:
    file: ./secrets/mediamtx_publish_password
  mediamtx_read_password:
    file: ./secrets/mediamtx_read_password
  bootstrap_admin_password:
    file: ./secrets/bootstrap_admin_password
