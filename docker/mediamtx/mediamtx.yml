# MediaMTX Production Configuration for Border-AI Camera Relays
# Runs inside the isolated internal 'media' Docker network

# Global Settings
logLevel: warn
logDestinations: [stdout]

# RTSP Server Configuration
rtsp: yes
protocols: [tcp, udp]
rtspAddress: :8554
rtpAddress: :8000
rtcpAddress: :8001

# Disable Public Protocols
rtmp: no
hls: no
webrtc: no
srt: no

# Default Authentication & Path Rules
# Read and publish require credentials configured via secrets
paths:
  all_others:
    # Fallback for dynamic camera endpoints
    readUser: reader
    readPass: readpass2026
    publishUser: publisher
    publishPass: publishpass2026

  cam1:
    readUser: reader
    readPass: readpass2026
    publishUser: publisher
    publishPass: publishpass2026

  cam2:
    readUser: reader
    readPass: readpass2026
    publishUser: publisher
    publishPass: publishpass2026

  cam3:
    readUser: reader
    readPass: readpass2026
    publishUser: publisher
    publishPass: publishpass2026

  cam4:
    readUser: reader
    readPass: readpass2026
    publishUser: publisher
    publishPass: publishpass2026
