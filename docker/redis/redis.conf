# Border-AI Redis 7.4 Production Configuration
# Configured for persistent event streams and strict ACL authentication

# Network & Daemon
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no

# Logging
loglevel notice
logfile ""

# Persistence (Append Only File + Snapshot)
dir /data
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory Management
maxmemory 1gb
maxmemory-policy noeviction
