pid /tmp/nginx.pid;
worker_processes auto;

events {
  worker_connections 1024;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;

  # Custom log format that excludes query strings ($uri instead of $request_uri)
  # This prevents leaking sensitive stream tokens and WebSocket tickets in access logs.
  log_format main_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent rid=$request_id rt=$request_time urt=$upstream_response_time';

  access_log /dev/stdout main_noquery;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  # Edge Rate Limiting Zones
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  # WebSocket Connection Upgrade Mapping
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Upstream Service Definitions
  upstream backend {
    server backend:4000;
    keepalive 32;
  }

  upstream frontend {
    server frontend:8080;
    keepalive 8;
  }

  upstream engine {
    server ai-engine:8001;
    keepalive 8;
  }

  include /etc/nginx/conf.d/*.conf;
}
