# HTTP to HTTPS Strict Redirect
server {
  listen 8080;
  server_name _;
  return 301 https://$host$request_uri;
}

# Production TLS Edge Server
server {
  listen 8443 ssl;
  http2 on;
  server_name _;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  include /etc/nginx/snippets/security-headers.conf;

  client_max_body_size 1m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 65s;
  limit_conn conn 50;

  # Lightweight Health Check Endpoint
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # --- REST API ---
  location /api/ {
    limit_req zone=api burst=60 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://backend;
  }

  # --- Authentication Route (Strict Rate Limiting) ---
  location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://backend;
  }

  # --- Real-Time WebSocket Gateway ---
  location /api/ws {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://backend;
  }

  # --- Live MJPEG Video Streams (Unbuffered & Non-Compressed) ---
  location /stream/ {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    gzip off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    proxy_pass http://engine/cam/;
  }

  # --- Block Internal API Documentation in Production Edge ---
  location ~ ^/(docs|openapi\.json) {
    return 404;
  }

  # --- Static Frontend SPA ---
  location / {
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_pass http://frontend;
  }
}
