# Border-AI PostgreSQL 16 Production Configuration
# Tuned for high-ingestion time-series event sinks and surveillance metadata

# Connection & Network
listen_addresses = '*'
port = 5432
max_connections = 100

# Memory & Caching
shared_buffers = 512MB
effective_cache_size = 1536MB
maintenance_work_mem = 128MB
work_mem = 5242kB

# Write Ahead Log (WAL) & Checkpoints
wal_level = replica
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9

# Query Planner & Storage
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Timezone & Localization (Deterministic UTC)
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, ymd'

# Structured Logging
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_min_messages = warning
log_connections = off
log_disconnections = off
