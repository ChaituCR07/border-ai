name: Deployment Verification & Container Hardening

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  lint-compose:
    name: Compose Config & Shell Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Compose
        run: |
          docker compose version

      - name: Validate Production Compose Config
        run: |
          ./scripts/gen_secrets.sh
          ./scripts/gen_certs.sh
          docker compose config -q

      - name: Validate GPU Override Config
        run: |
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q

      - name: Validate Dev Override Config
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

      - name: Validate macOS Hybrid Config
        run: |
          docker compose -f docker-compose.yml -f docker-compose.hybrid.yml config -q

  canary-and-hardening:
    name: Canary Secret Scan & Deployment Tests
    runs-on: ubuntu-latest
    needs: [lint-compose]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate Ephemeral Secrets & Certs
        run: |
          ./scripts/gen_secrets.sh
          ./scripts/gen_certs.sh

      - name: Run Canary Secret Leak Scanner
        run: |
          python3 scripts/compose_canary_scan.py

      - name: Run Hardening and Isolation Audits
        run: |
          ./scripts/verify_hardening.sh
          ./scripts/verify_isolation.sh

      - name: Run Python Deployment Test Suite
        run: |
          python3 tests/deploy/test_canary_scan.py
          python3 tests/deploy/test_compose_deployment.py
          python3 tests/test_backup_restore.py
          python3 tests/test_model_fetch.py
