# Workload Profile Configuration and Camera Feed Mapping
# Each profile defines clips, resolution, and staggered start offsets (>= 7s) for up to 16 cameras.

light:
  description: "Sparse desert perimeter / open roadway with rare movement (< 2 detections/frame, zero plates)"
  nominal_resolution: "720p"
  covariates:
    mean_detections_per_frame: 1.4
    p95_detections_per_frame: 2.0
    expected_vehicles_per_min: 4.0
    expected_ocr_calls_per_sec: 0.1
  cameras:
    CAM-01: { clip: "footage/camera_01/normal.mp4", offset_s: 0.0, fps: 25 }
    CAM-02: { clip: "footage/camera_01/normal.mp4", offset_s: 7.5, fps: 25 }
    CAM-03: { clip: "footage/camera_01/normal.mp4", offset_s: 15.0, fps: 25 }
    CAM-04: { clip: "footage/camera_01/normal.mp4", offset_s: 22.5, fps: 25 }
    CAM-05: { clip: "footage/camera_01/normal.mp4", offset_s: 30.0, fps: 25 }
    CAM-06: { clip: "footage/camera_01/normal.mp4", offset_s: 37.5, fps: 25 }
