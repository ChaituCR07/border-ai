model:
  name: yolov8n.pt
  device: auto            # auto | cpu | cuda:0
  half: false             # FP16 (GPU only); decide after benchmarking
  confidence: 0.4
  iou: 0.5
  image_size: 640
  max_det: 300
  classes: [person, bicycle, car, motorcycle, bus, truck]

tracker:
  type: bytetrack
  detection_conf: 0.15      # was 0.25; lowered to 0.15 to activate ByteTrack low-confidence second pass
  track_high_thresh: 0.5    # detections above this can start/continue tracks
  track_low_thresh: 0.1     # detections between low and high can only continue tracks
  new_track_thresh: 0.6     # minimum score to create a NEW track
  track_buffer: 30          # lost-track memory, in frames at 30 FPS (scaled by real FPS)
  match_thresh: 0.8         # association threshold (higher = more permissive matching)
  fuse_score: true          # combine IoU with detection score when matching
  trail_length: 40          # points kept per track for drawing and Day 6 logic

video:
  target_fps: 15
  resize_width: 1280

anpr:
  enabled: true
  vehicle_classes: [car, truck, bus, motorcycle]
  formats: [indian, generic]        # indian = KA01AB1234 style; generic = any 5-10 letters/digits
  preprocess: clahe                 # none | gray | clahe | sharpen
  preprocess_height: 96             # plate crop is resized to this height before OCR
  crop_pad: 0.10                    # padding around the detected plate box
  save_crops: true                  # save the best plate crop per vehicle (evidence); contains personal data
  keep_read_log: true               # keep every individual OCR read in the record (for evaluation)
  queue_size: 32
  locator:
    type: yolo                      # yolo | lower_region (fallback: no plate detector needed)
    weights: plate_detector.pt      # file in ai-engine/models/
    conf: 0.4
    imgsz: 640
    min_aspect: 1.0                 # plate box width/height range
    max_aspect: 7.0
    min_area_frac: 0.002            # plate box area as a fraction of the vehicle crop
    max_area_frac: 0.30
  ocr:
    engine: paddle                  # paddle | http | fake
    lang: en
    device: cpu                     # cpu | gpu:0
    url: http://127.0.0.1:8100/ocr  # only for engine: http
    min_confidence: 0.30
  schedule:
    min_track_hits: 5               # a vehicle must be tracked this many frames before OCR starts
    ocr_every_n_frames: 5           # OCR cadence per vehicle
    max_reads_per_track: 20         # stop OCR for a vehicle after this many reads
    min_vehicle_width_px: 90        # vehicles smaller than this are too far for readable plates
    border_margin_px: 8             # skip vehicles cut off by the frame edge (0 disables)
    crop_margin: 0.05
  quality:
    min_plate_width_px: 50
    min_plate_height_px: 15
    min_sharpness: 40.0
  consensus:
    min_reads: 3                    # reads needed before a plate can be called stable
    stable_share: 0.6               # agreement needed for stable
    loose_weight: 0.6               # weight of reads that fit only the generic format
    invalid_weight: 0.3             # weight of reads that fit no format (0 excludes them)
    final_min_confidence: 0.5       # minimum confidence to emit an event for a never-stable vehicle

watchlist:
  enabled: true
  backend: postgres               # postgres | memory
  require_db: false               # true = refuse to start when PostgreSQL is unreachable (production)
  seed_csv: ""                    # memory backend only: load entries from this CSV (relative to the repo root)
  entity_types: [VEHICLE, PLATE]  # types matched against recognized plates
  alert_min_confidence: 0.70      # plate confidence needed for an ALERT; below it a match is REVIEW (set from your Day 8 E7)
  min_score: 40                   # below this score no hit is recorded
  near_max_distance: 1.0          # OCR-aware distance allowed for a near match (0 disables near matching)
  near_penalty: 0.2               # score quality lost per unit of distance
  near_can_alert: false           # near matches are always REVIEW unless true
  cooldown_s: 60                  # per camera + entry: suppress repeat alerts
  snapshot_refresh_s: 60          # refresh of the in-memory fallback copy
  queue_size: 100
  submit_timeout_s: 2.0           # live mode: how long submit() may wait for queue space
  max_candidates: 5000            # near-match candidates fetched per lookup

identity:
  enabled: false                   # master switch. Face and Re-ID processing are OFF unless you turn them on
  person_classes: [person]
  max_jobs_per_frame: 4            # at most this many person crops per frame (largest first)
  queue_size: 64
  save_crops: false                # never save face or person images unless you really need to
  crop_margin: 0.05
  face:
    enabled: true
    engine: opencv                 # opencv | insightface
    detector_model: face/face_detection_yunet_2023mar.onnx      # under ai-engine/models/
    recognizer_model: face/face_recognition_sface_2021dec.onnx
    insightface_pack: buffalo_l    # only for engine: insightface (check the license)
    upper_fraction: 0.6            # search for the face in the top 60% of the person crop
    detector_score: 0.8
    min_face_px: 40
    max_yaw_ratio: 0.5             # larger = more turned away; profile faces are skipped
    min_sharpness: 30.0
    every_n_frames: 5
    min_track_hits: 5
    max_reads_per_track: 15
    min_person_height_px: 120
    border_margin_px: 8
    min_embeddings: 3              # good faces needed before a search
    min_consistency: 0.75          # embeddings of one track must agree (catches mixed identities)
    review_threshold: 0.45         # cosine similarity. MODEL-SPECIFIC: set from face_eval.py
    alert_threshold: 0.60
    allow_alert: false             # false = face matches are always 'review'
    min_margin: 0.05               # best match must beat the second best by this much
    cooldown_s: 60
    gallery_refresh_s: 60
  reid:
    enabled: true
    embedder: color_layout         # color_layout (baseline) | onnx
    onnx_model: reid/reid_model.onnx
    onnx_input: [128, 256]         # width, height
    every_n_frames: 15
    min_track_hits: 10
    max_samples_per_track: 8
    min_person_height_px: 96
    border_margin_px: 8
    min_samples: 3
    similarity_threshold: 0.90     # MODEL-SPECIFIC: set from reid_eval.py
    max_gap_s: 600
    allow_overlap: true            # candidates seen at the same time on another camera are allowed
    camera_pairs: []               # [] = any pair; otherwise [[CAM_001, CAM_002]]
    gallery_ttl_s: 900
    gallery_max_items: 2000
    max_queries: 2
