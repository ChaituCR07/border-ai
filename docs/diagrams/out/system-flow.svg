<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Border-AI End-to-End System Flow &amp; Alert Lifecycle</text>
  <text x="550" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">Multi-Participant Sequence: Detection &#8594; Stream Bus &#8594; Idempotent Persistence &#8594; Sub-50ms WS Push &#8594; Operator ACK</text>

  <!-- Participant Lifeline Headers -->
  <!-- 1. AI Engine -->
  <g transform="translate(60, 90)">
    <rect width="140" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="25" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">AI Engine</text>
    <line x1="70" y1="40" x2="70" y2="540" stroke="#334155" stroke-dasharray="4,4"/>
  </g>

  <!-- 2. Redis Streams -->
  <g transform="translate(240, 90)">
    <rect width="140" height="40" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="70" y="25" text-anchor="middle" fill="#10b981" font-size="12" font-weight="600">Redis Streams</text>
    <line x1="70" y1="40" x2="70" y2="540" stroke="#334155" stroke-dasharray="4,4"/>
  </g>

  <!-- 3. Asynchronous Sink -->
  <g transform="translate(420, 90)">
    <rect width="140" height="40" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
    <text x="70" y="25" text-anchor="middle" fill="#059669" font-size="12" font-weight="600">Async DB Sink</text>
    <line x1="70" y1="40" x2="70" y2="540" stroke="#334155" stroke-dasharray="4,4"/>
  </g>

  <!-- 4. PostgreSQL 16 -->
  <g transform="translate(600, 90)">
    <rect width="140" height="40" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="70" y="25" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="600">PostgreSQL 16</text>
    <line x1="70" y1="40" x2="70" y2="540" stroke="#334155" stroke-dasharray="4,4"/>
  </g>

  <!-- 5. WebSocket Gateway -->
  <g transform="translate(780, 90)">
    <rect width="140" height="40" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="70" y="25" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="600">WS Gateway</text>
    <line x1="70" y1="40" x2="70" y2="540" stroke="#334155" stroke-dasharray="4,4"/>
  </g>

  <!-- 6. React Dashboard -->
  <g transform="translate(940, 90)">
    <rect width="130" height="40" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="65" y="25" text-anchor="middle" fill="#f43f5e" font-size="12" font-weight="600">React Dashboard</text>
    <line x1="65" y1="40" x2="65" y2="540" stroke="#334155" stroke-dasharray="4,4"/>
  </g>

  <!-- Messages / Interactions -->
  <!-- 1. Engine writes snapshot -->
  <rect x="70" y="160" width="120" height="24" rx="4" fill="#0f172a" stroke="#475569"/>
  <text x="130" y="176" text-anchor="middle" fill="#cbd5e1" font-size="10">1. Snapshot saved to disk</text>

  <!-- 2. Engine XADD Redis -->
  <line x1="130" y1="210" x2="310" y2="210" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#flowArrow)"/>
  <text x="220" y="202" text-anchor="middle" fill="#94a3b8" font-size="11">2. XADD surveillance.alerts (UUID)</text>

  <!-- 3. Parallel Sink Consume & WS Tail Read -->
  <line x1="310" y1="250" x2="490" y2="250" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#flowArrow)"/>
  <text x="400" y="242" text-anchor="middle" fill="#6ee7b7" font-size="10">3a. XREADGROUP (Sink)</text>

  <line x1="310" y1="290" x2="850" y2="290" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#flowArrow)"/>
  <text x="580" y="282" text-anchor="middle" fill="#fcd34d" font-size="10">3b. XREAD tail (WebSocket Gateway)</text>

  <!-- 4. Sink to Postgres -->
  <line x1="490" y1="330" x2="670" y2="330" stroke="#059669" stroke-width="1.5" marker-end="url(#flowArrow)"/>
  <text x="580" y="322" text-anchor="middle" fill="#a7f3d0" font-size="10">4. INSERT ON CONFLICT DO NOTHING</text>

  <!-- 5. Gateway pushes to Dashboard -->
  <line x1="850" y1="370" x2="1005" y2="370" stroke="#f43f5e" stroke-width="2" marker-end="url(#redArrow)"/>
  <text x="927" y="362" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">5. alert.created (&lt;50ms)</text>

  <!-- 6. UI Toast & Audio -->
  <rect x="940" y="400" width="130" height="28" rx="4" fill="#3b0764" stroke="#c084fc"/>
  <text x="1005" y="418" text-anchor="middle" fill="#e9d5ff" font-size="10" font-weight="600">6. Toast &amp; Sound Alert</text>

  <!-- 7. Operator Acknowledges -->
  <line x1="1005" y1="460" x2="670" y2="460" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#flowArrow)"/>
  <text x="837" y="452" text-anchor="middle" fill="#38bdf8" font-size="10">7. PATCH /api/v1/alerts/:id/ack</text>

  <!-- 8. Gateway Broadcasts Update to All Sessions -->
  <line x1="850" y1="500" x2="1005" y2="500" stroke="#10b981" stroke-width="1.5" marker-end="url(#flowArrow)"/>
  <text x="927" y="492" text-anchor="middle" fill="#6ee7b7" font-size="10">8. alert.updated (All operators)</text>

  <!-- Footer explanation note -->
  <rect x="250" y="620" width="600" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="550" y="645" text-anchor="middle" fill="#94a3b8" font-size="11">Guarantees: Zero telemetry drop during DB outages (Redis Stream buffering) + Single-winner atomic ACK (ADR 0016)</text>
</svg>
