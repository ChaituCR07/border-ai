<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" width="1100" height="750" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="tableShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <text x="550" y="38" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Border-AI Relational Database ERD &amp; Schema Topology</text>
  <text x="550" y="62" text-anchor="middle" fill="#94a3b8" font-size="13">PostgreSQL 16 Multi-Domain Relational Schema (Migrations 001 – 009)</text>

  <!-- Domain 1: Camera & Spatial Topology -->
  <g transform="translate(40, 90)">
    <rect width="310" height="270" rx="10" fill="#1e293b" stroke="#38bdf8" filter="url(#tableShadow)"/>
    <rect width="310" height="30" rx="10" fill="#0369a1"/>
    <text x="155" y="20" text-anchor="middle" fill="#f0f9ff" font-size="12" font-weight="700">CAMERAS, ZONES &amp; TOPOLOGY</text>

    <!-- Table: cameras -->
    <rect x="15" y="45" width="280" height="95" rx="6" fill="#0f172a" stroke="#0284c7"/>
    <text x="25" y="63" fill="#38bdf8" font-size="11" font-weight="700">TABLE cameras</text>
    <text x="25" y="80" fill="#94a3b8" font-size="10">&#8226; id (VARCHAR PK) &#8212; Unique Cam ID</text>
    <text x="25" y="96" fill="#94a3b8" font-size="10">&#8226; name, rtsp_url, zone_id</text>
    <text x="25" y="112" fill="#94a3b8" font-size="10">&#8226; status (ONLINE, OFFLINE, DEGRADED)</text>
    <text x="25" y="128" fill="#94a3b8" font-size="10">&#8226; last_heartbeat (TIMESTAMPTZ)</text>

    <!-- Table: zones & lines -->
    <rect x="15" y="155" width="280" height="95" rx="6" fill="#0f172a" stroke="#0284c7"/>
    <text x="25" y="173" fill="#38bdf8" font-size="11" font-weight="700">TABLE zones &amp; lines</text>
    <text x="25" y="190" fill="#94a3b8" font-size="10">&#8226; id (VARCHAR PK), camera_id (FK)</text>
    <text x="25" y="206" fill="#94a3b8" font-size="10">&#8226; polygon / coordinates (JSONB)</text>
    <text x="25" y="222" fill="#94a3b8" font-size="10">&#8226; zone_type (restricted, buffer, transit)</text>
    <text x="25" y="238" fill="#94a3b8" font-size="10">&#8226; direction (ingress, egress, bi)</text>
  </g>

  <!-- Domain 2: Events, Tracks, Detections -->
  <g transform="translate(390, 90)">
    <rect width="320" height="340" rx="10" fill="#1e293b" stroke="#10b981" filter="url(#tableShadow)"/>
    <rect width="320" height="30" rx="10" fill="#047857"/>
    <text x="160" y="20" text-anchor="middle" fill="#ecfdf5" font-size="12" font-weight="700">EVENTS, TRACKS &amp; SIGHTINGS</text>

    <!-- Table: events -->
    <rect x="15" y="45" width="290" height="110" rx="6" fill="#0f172a" stroke="#059669"/>
    <text x="25" y="63" fill="#34d399" font-size="11" font-weight="700">TABLE events</text>
    <text x="25" y="80" fill="#94a3b8" font-size="10">&#8226; id (VARCHAR PK), camera_id (FK)</text>
    <text x="25" y="96" fill="#94a3b8" font-size="10">&#8226; track_id (INT), event_type (VARCHAR)</text>
    <text x="25" y="112" fill="#94a3b8" font-size="10">&#8226; details (JSONB: bbox, points, rule_id)</text>
    <text x="25" y="128" fill="#94a3b8" font-size="10">&#8226; timestamp (TIMESTAMPTZ INDEX)</text>
    <text x="25" y="144" fill="#a7f3d0" font-size="9">&#8618; Keyset cursor on (timestamp, id)</text>

    <!-- Table: track_summaries -->
    <rect x="15" y="170" width="290" height="95" rx="6" fill="#0f172a" stroke="#059669"/>
    <text x="25" y="188" fill="#34d399" font-size="11" font-weight="700">TABLE track_summaries</text>
    <text x="25" y="205" fill="#94a3b8" font-size="10">&#8226; id (BIGSERIAL PK), camera_id (FK)</text>
    <text x="25" y="221" fill="#94a3b8" font-size="10">&#8226; track_id, object_class, dwell_seconds</text>
    <text x="25" y="237" fill="#94a3b8" font-size="10">&#8226; trajectory_points (JSONB), plate_number</text>
    <text x="25" y="253" fill="#a7f3d0" font-size="9">&#8618; 99.5% storage reduction vs raw frames</text>
  </g>

  <!-- Domain 3: Alerts & Notifications -->
  <g transform="translate(750, 90)">
    <rect width="310" height="340" rx="10" fill="#1e293b" stroke="#f43f5e" filter="url(#tableShadow)"/>
    <rect width="310" height="30" rx="10" fill="#be123c"/>
    <text x="155" y="20" text-anchor="middle" fill="#fff1f2" font-size="12" font-weight="700">ALERTS &amp; OUTBOX</text>

    <!-- Table: alerts -->
    <rect x="15" y="45" width="280" height="150" rx="6" fill="#0f172a" stroke="#e11d48"/>
    <text x="25" y="63" fill="#fb7185" font-size="11" font-weight="700">TABLE alerts</text>
    <text x="25" y="80" fill="#94a3b8" font-size="10">&#8226; id (UUID PK) &#8212; Deterministic ID</text>
    <text x="25" y="96" fill="#94a3b8" font-size="10">&#8226; camera_id (FK), track_id (INT)</text>
    <text x="25" y="112" fill="#94a3b8" font-size="10">&#8226; severity (LOW, MEDIUM, HIGH, CRITICAL)</text>
    <text x="25" y="128" fill="#94a3b8" font-size="10">&#8226; threat_score (INT: 0 to 100)</text>
    <text x="25" y="144" fill="#94a3b8" font-size="10">&#8226; status (OPEN, ACKNOWLEDGED, RESOLVED)</text>
    <text x="25" y="160" fill="#94a3b8" font-size="10">&#8226; contributions (JSONB factor list)</text>
    <text x="25" y="176" fill="#94a3b8" font-size="10">&#8226; snapshot_path, created_at, acknowledged_at</text>

    <!-- Table: notification_outbox -->
    <rect x="15" y="210" width="280" height="100" rx="6" fill="#0f172a" stroke="#e11d48"/>
    <text x="25" y="228" fill="#fb7185" font-size="11" font-weight="700">TABLE notification_outbox</text>
    <text x="25" y="245" fill="#94a3b8" font-size="10">&#8226; id (UUID PK), alert_id (FK)</text>
    <text x="25" y="261" fill="#94a3b8" font-size="10">&#8226; channel (email), recipient</text>
    <text x="25" y="277" fill="#94a3b8" font-size="10">&#8226; status (PENDING, SENT, FAILED)</text>
    <text x="25" y="293" fill="#a7f3d0" font-size="9">&#8618; Anti-join transactional outbox (ADR 0029)</text>
  </g>

  <!-- Domain 4: Watchlist & Biometrics -->
  <g transform="translate(40, 390)">
    <rect width="310" height="280" rx="10" fill="#1e293b" stroke="#eab308" filter="url(#tableShadow)"/>
    <rect width="310" height="30" rx="10" fill="#a16207"/>
    <text x="155" y="20" text-anchor="middle" fill="#fefce8" font-size="12" font-weight="700">WATCHLISTS &amp; IDENTITIES</text>

    <!-- Table: watchlist_vehicles -->
    <rect x="15" y="45" width="280" height="105" rx="6" fill="#0f172a" stroke="#ca8a04"/>
    <text x="25" y="63" fill="#facc15" font-size="11" font-weight="700">TABLE watchlist_vehicles</text>
    <text x="25" y="80" fill="#94a3b8" font-size="10">&#8226; id (VARCHAR PK)</text>
    <text x="25" y="96" fill="#94a3b8" font-size="10">&#8226; plate_norm (VARCHAR UNIQUE INDEX)</text>
    <text x="25" y="112" fill="#94a3b8" font-size="10">&#8226; reason, severity (CRITICAL, HIGH)</text>
    <text x="25" y="128" fill="#94a3b8" font-size="10">&#8226; active (BOOLEAN), created_at</text>

    <!-- Table: watchlist_hits -->
    <rect x="15" y="165" width="280" height="95" rx="6" fill="#0f172a" stroke="#ca8a04"/>
    <text x="25" y="183" fill="#facc15" font-size="11" font-weight="700">TABLE watchlist_hits</text>
    <text x="25" y="200" fill="#94a3b8" font-size="10">&#8226; id (BIGSERIAL PK), vehicle_id (FK)</text>
    <text x="25" y="216" fill="#94a3b8" font-size="10">&#8226; camera_id, raw_plate, score (0-100)</text>
    <text x="25" y="232" fill="#94a3b8" font-size="10">&#8226; timestamp, lookalike_substitutions</text>
  </g>

  <!-- Domain 5: Security, RBAC & Audit Log -->
  <g transform="translate(390, 450)">
    <rect width="670" height="220" rx="10" fill="#1e293b" stroke="#818cf8" filter="url(#tableShadow)"/>
    <rect width="670" height="30" rx="10" fill="#4338ca"/>
    <text x="335" y="20" text-anchor="middle" fill="#e0e7ff" font-size="12" font-weight="700">AUTHENTICATION, LEAST-PRIVILEGE RBAC &amp; HASH-CHAINED AUDIT LOG</text>

    <!-- Table: users & sessions -->
    <rect x="15" y="45" width="310" height="150" rx="6" fill="#0f172a" stroke="#4f46e5"/>
    <text x="25" y="63" fill="#a5b4fc" font-size="11" font-weight="700">TABLE users &amp; sessions</text>
    <text x="25" y="80" fill="#94a3b8" font-size="10">&#8226; id (UUID PK), email (UNIQUE)</text>
    <text x="25" y="96" fill="#94a3b8" font-size="10">&#8226; role (VIEWER, OPERATOR, INVESTIGATOR, ADMIN)</text>
    <text x="25" y="112" fill="#94a3b8" font-size="10">&#8226; password_hash (Argon2id)</text>
    <text x="25" y="128" fill="#94a3b8" font-size="10">&#8226; refresh_token_hash, expires_at</text>
    <text x="25" y="144" fill="#a5b4fc" font-size="9">&#8618; Rotating refresh cookies + Ed25519 JWT</text>

    <!-- Table: api_audit_log -->
    <rect x="345" y="45" width="310" height="150" rx="6" fill="#0f172a" stroke="#4f46e5"/>
    <text x="355" y="63" fill="#a5b4fc" font-size="11" font-weight="700">TABLE api_audit_log (Immutable)</text>
    <text x="355" y="80" fill="#94a3b8" font-size="10">&#8226; id (BIGSERIAL PK), user_id (FK)</text>
    <text x="355" y="96" fill="#94a3b8" font-size="10">&#8226; action (LOGIN, ACK_ALERT, EXPORT_CSV)</text>
    <text x="355" y="112" fill="#94a3b8" font-size="10">&#8226; resource_id, ip_address, status</text>
    <text x="355" y="128" fill="#94a3b8" font-size="10">&#8226; prev_hash, current_hash (SHA-256)</text>
    <text x="355" y="144" fill="#a5b4fc" font-size="9">&#8618; Cryptographically verified hash chain</text>
  </g>

  <!-- Footer -->
  <text x="550" y="725" text-anchor="middle" fill="#64748b" font-size="11">PostgreSQL 16 Engine Ownership: Python Engine owns raw events/sightings; Node API owns alerts state and audit log.</text>
</svg>
