<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">Border-AI Composite Threat Scoring Pipeline (0–100)</text>
  <text x="500" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Decaying Multi-Factor Mathematical Scoring with Explainable Factor Checklists</text>

  <!-- Stage 1: Observations -->
  <g transform="translate(30, 85)">
    <rect width="210" height="340" rx="10" fill="#1e293b" stroke="#334155" filter="url(#boxShadow)"/>
    <rect width="210" height="28" rx="10" fill="#334155"/>
    <text x="105" y="19" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">1. OBSERVATIONS</text>

    <rect x="15" y="40" width="180" height="55" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="105" y="60" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">Restricted Zone Entry</text>
    <text x="105" y="78" text-anchor="middle" fill="#94a3b8" font-size="10">Foot-point inside polygon</text>

    <rect x="15" y="105" width="180" height="55" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="105" y="125" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">Virtual Line Crossing</text>
    <text x="105" y="143" text-anchor="middle" fill="#94a3b8" font-size="10">Perimeter fence ingress</text>

    <rect x="15" y="170" width="180" height="55" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="105" y="190" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">After-Hours Movement</text>
    <text x="105" y="208" text-anchor="middle" fill="#94a3b8" font-size="10">22:00 – 05:00 night window</text>

    <rect x="15" y="235" width="180" height="55" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="105" y="255" text-anchor="middle" fill="#f1f5f9" font-size="11" font-weight="600">Watchlist Vehicle Hit</text>
    <text x="105" y="273" text-anchor="middle" fill="#94a3b8" font-size="10">Plate: KA01AB1234 (stolen)</text>
  </g>

  <!-- Stage 2: Declarative Rules -->
  <g transform="translate(280, 85)">
    <rect width="210" height="340" rx="10" fill="#1e293b" stroke="#38bdf8" filter="url(#boxShadow)"/>
    <rect width="210" height="28" rx="10" fill="#0284c7"/>
    <text x="105" y="19" text-anchor="middle" fill="#f0f9ff" font-size="11" font-weight="600">2. RULE ENGINE (POINTS)</text>

    <rect x="15" y="40" width="180" height="55" rx="6" fill="#0f172a" stroke="#0284c7"/>
    <text x="105" y="60" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">Rule R001: Zone</text>
    <text x="105" y="78" text-anchor="middle" fill="#e0f2fe" font-size="11" font-weight="700">+30 Points</text>

    <rect x="15" y="105" width="180" height="55" rx="6" fill="#0f172a" stroke="#0284c7"/>
    <text x="105" y="125" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">Rule R002: Tripwire</text>
    <text x="105" y="143" text-anchor="middle" fill="#e0f2fe" font-size="11" font-weight="700">+20 Points</text>

    <rect x="15" y="170" width="180" height="55" rx="6" fill="#0f172a" stroke="#0284c7"/>
    <text x="105" y="190" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">Rule R004: Night Clock</text>
    <text x="105" y="208" text-anchor="middle" fill="#e0f2fe" font-size="11" font-weight="700">+10 Points</text>

    <rect x="15" y="235" width="180" height="55" rx="6" fill="#0f172a" stroke="#0284c7"/>
    <text x="105" y="255" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">Rule R005: Watchlist</text>
    <text x="105" y="273" text-anchor="middle" fill="#e0f2fe" font-size="11" font-weight="700">+40 Points</text>
  </g>

  <!-- Connectors 1 to 2 -->
  <line x1="240" y1="150" x2="280" y2="150" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <line x1="240" y1="215" x2="280" y2="215" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <line x1="240" y1="280" x2="280" y2="280" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowHead)"/>
  <line x1="240" y1="345" x2="280" y2="345" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowHead)"/>

  <!-- Stage 3: Scorer Core -->
  <g transform="translate(530, 85)">
    <rect width="190" height="340" rx="10" fill="#1e293b" stroke="#818cf8" filter="url(#boxShadow)"/>
    <rect width="190" height="28" rx="10" fill="#4338ca"/>
    <text x="95" y="19" text-anchor="middle" fill="#e0e7ff" font-size="11" font-weight="600">3. COMPOSITE SCORER</text>

    <rect x="15" y="45" width="160" height="75" rx="6" fill="#0f172a" stroke="#6366f1"/>
    <text x="95" y="68" text-anchor="middle" fill="#c7d2fe" font-size="11" font-weight="600">Sliding Window</text>
    <text x="95" y="85" text-anchor="middle" fill="#94a3b8" font-size="10">Decay: 600s (10 min)</text>
    <text x="95" y="102" text-anchor="middle" fill="#94a3b8" font-size="10">Evidence half-life: 300s</text>

    <rect x="15" y="140" width="160" height="75" rx="6" fill="#0f172a" stroke="#6366f1"/>
    <text x="95" y="163" text-anchor="middle" fill="#c7d2fe" font-size="11" font-weight="600">Deduplication</text>
    <text x="95" y="180" text-anchor="middle" fill="#94a3b8" font-size="10">Zero double-counting</text>
    <text x="95" y="197" text-anchor="middle" fill="#94a3b8" font-size="10">Rearm cooldown: 300s</text>

    <rect x="15" y="235" width="160" height="75" rx="6" fill="#0f172a" stroke="#6366f1"/>
    <text x="95" y="258" text-anchor="middle" fill="#c7d2fe" font-size="11" font-weight="600">Score Clamping</text>
    <text x="95" y="275" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="700">0 to 100 Integer</text>
    <text x="95" y="295" text-anchor="middle" fill="#94a3b8" font-size="10">Escalation triggers</text>
  </g>

  <!-- Connectors 2 to 3 -->
  <line x1="490" y1="255" x2="530" y2="255" stroke="#818cf8" stroke-width="2" marker-end="url(#arrowHead)"/>

  <!-- Stage 4: Alert Tiers -->
  <g transform="translate(760, 85)">
    <rect width="210" height="340" rx="10" fill="#1e293b" stroke="#f43f5e" filter="url(#boxShadow)"/>
    <rect width="210" height="28" rx="10" fill="#9f1239"/>
    <text x="105" y="19" text-anchor="middle" fill="#ffe4e6" font-size="11" font-weight="600">4. ALERT TIERS &amp; ACTIONS</text>

    <rect x="15" y="38" width="180" height="52" rx="6" fill="#0f172a" stroke="#3b82f6"/>
    <text x="105" y="58" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">LOW (0 – 29)</text>
    <text x="105" y="75" text-anchor="middle" fill="#94a3b8" font-size="10">Telemetry log only</text>

    <rect x="15" y="98" width="180" height="52" rx="6" fill="#0f172a" stroke="#eab308"/>
    <text x="105" y="118" text-anchor="middle" fill="#fde047" font-size="11" font-weight="600">MEDIUM (30 – 49)</text>
    <text x="105" y="135" text-anchor="middle" fill="#94a3b8" font-size="10">Yellow UI bounding box</text>

    <rect x="15" y="158" width="180" height="68" rx="6" fill="#431407" stroke="#ea580c"/>
    <text x="105" y="178" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="700">HIGH (50 – 69)</text>
    <text x="105" y="196" text-anchor="middle" fill="#fed7aa" font-size="10">Scenario 1 (Score 60)</text>
    <text x="105" y="212" text-anchor="middle" fill="#fed7aa" font-size="10">Red box, Toast, Sound</text>

    <rect x="15" y="234" width="180" height="80" rx="6" fill="#4c0519" stroke="#e11d48"/>
    <text x="105" y="254" text-anchor="middle" fill="#fecdd3" font-size="11" font-weight="700">CRITICAL (70 – 100)</text>
    <text x="105" y="272" text-anchor="middle" fill="#fda4af" font-size="10">Scenario 2 (Score 80)</text>
    <text x="105" y="288" text-anchor="middle" fill="#fda4af" font-size="10">Banner, Sound Chime</text>
    <text x="105" y="304" text-anchor="middle" fill="#fda4af" font-size="10">Email Outbox + Snapshot</text>
  </g>

  <!-- Connectors 3 to 4 -->
  <line x1="720" y1="255" x2="760" y2="255" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowHead)"/>

  <!-- Footer explanation note -->
  <text x="500" y="455" text-anchor="middle" fill="#64748b" font-size="11">Arithmetic: Score = Min(100, &sum; (Points &times; Multiplier) with Exclusion Masks). Escalations emit on threshold crossing.</text>
</svg>
